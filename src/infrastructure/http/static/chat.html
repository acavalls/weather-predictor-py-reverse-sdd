<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Agent</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f7f7f8;
            --surface: #ffffff;
            --user-bubble: #0d8a72;
            --user-text: #ffffff;
            --agent-bubble: #ffffff;
            --agent-text: #1a1a1a;
            --border: #e5e5e7;
            --text-primary: #1a1a1a;
            --text-secondary: #6e6e73;
            --input-bg: #ffffff;
            --shadow: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-lg: 0 4px 12px rgba(0,0,0,0.08);
            --radius: 16px;
            --radius-sm: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .header h1 .logo { font-size: 24px; }
        .header p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Messages area */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 768px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.agent { align-self: flex-start; }

        .message .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            margin-top: 4px;
        }
        .message.user .avatar { background: var(--user-bubble); }
        .message.agent .avatar { background: var(--border); }

        .message .bubble {
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user .bubble {
            background: var(--user-bubble);
            color: var(--user-text);
            border-bottom-right-radius: 4px;
        }
        .message.agent .bubble {
            background: var(--agent-bubble);
            color: var(--agent-text);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow);
        }

        /* Welcome message */
        .welcome {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-secondary);
        }
        .welcome .icon { font-size: 48px; margin-bottom: 16px; }
        .welcome h2 { font-size: 22px; color: var(--text-primary); margin-bottom: 8px; font-weight: 600; }
        .welcome p { font-size: 15px; max-width: 400px; margin: 0 auto; }
        .welcome .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 24px;
        }
        .welcome .suggestion {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--text-primary);
        }
        .welcome .suggestion:hover {
            border-color: var(--user-bubble);
            box-shadow: var(--shadow);
        }

        /* Loading indicator */
        .loading {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
        }
        .loading .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: bounce 1.4s infinite ease-in-out;
        }
        .loading .dot:nth-child(1) { animation-delay: -0.32s; }
        .loading .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input area */
        .input-area {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            flex-shrink: 0;
        }
        .input-container {
            max-width: 768px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .input-container textarea {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 16px;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
            max-height: 120px;
            min-height: 48px;
            line-height: 1.4;
            background: var(--input-bg);
            transition: border-color 0.15s ease;
        }
        .input-container textarea:focus {
            border-color: var(--user-bubble);
        }
        .input-container button {
            background: var(--user-bubble);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s ease;
            flex-shrink: 0;
            height: 48px;
        }
        .input-container button:hover { opacity: 0.9; }
        .input-container button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Error message */
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            text-align: center;
            margin: 0 auto;
            max-width: 768px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><span class="logo">&#9729;</span> Weather Agent</h1>
        <p>Conversational weather powered by ML + RAG</p>
    </div>

    <div class="messages" id="messages">
        <div class="welcome" id="welcome">
            <div class="icon">&#9925;</div>
            <h2>What's the weather like?</h2>
            <p>Ask me anything about the weather. I'll check current conditions, run ML predictions, and give you a scientific answer.</p>
            <div class="suggestions">
                <button class="suggestion" onclick="sendSuggestion(this)">Will it rain tomorrow in Madrid?</button>
                <button class="suggestion" onclick="sendSuggestion(this)">Should I bring an umbrella in London?</button>
                <button class="suggestion" onclick="sendSuggestion(this)">What's the temperature in Tokyo now?</button>
                <button class="suggestion" onclick="sendSuggestion(this)">Is it good weather for flying in Berlin?</button>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-container">
            <textarea id="input" placeholder="Type your weather question..." rows="1" onkeydown="handleKey(event)"></textarea>
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const welcomeEl = document.getElementById('welcome');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        let isLoading = false;

        // Auto-resize textarea
        inputEl.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function sendSuggestion(btn) {
            inputEl.value = btn.textContent;
            sendMessage();
        }

        function addMessage(text, type) {
            if (welcomeEl) welcomeEl.style.display = 'none';

            const msg = document.createElement('div');
            msg.className = `message ${type}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerHTML = type === 'user' ? '&#128100;' : '&#9729;';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            msg.appendChild(avatar);
            msg.appendChild(bubble);
            messagesEl.appendChild(msg);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addLoading() {
            if (welcomeEl) welcomeEl.style.display = 'none';

            const msg = document.createElement('div');
            msg.className = 'message agent';
            msg.id = 'loading-msg';

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerHTML = '&#9729;';

            const loading = document.createElement('div');
            loading.className = 'loading';
            loading.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

            msg.appendChild(avatar);
            msg.appendChild(loading);
            messagesEl.appendChild(msg);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function removeLoading() {
            const el = document.getElementById('loading-msg');
            if (el) el.remove();
        }

        function showError(text) {
            const error = document.createElement('div');
            error.className = 'error';
            error.textContent = text;
            messagesEl.appendChild(error);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            setTimeout(() => error.remove(), 4000);
        }

        async function sendMessage() {
            const query = inputEl.value.trim();
            if (!query || isLoading) return;

            isLoading = true;
            sendBtn.disabled = true;
            inputEl.value = '';
            inputEl.style.height = 'auto';

            addMessage(query, 'user');
            addLoading();

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query }),
                });

                removeLoading();

                if (!res.ok) {
                    let detail = `Error ${res.status}`;
                    try {
                        const body = await res.text();
                        const json = JSON.parse(body);
                        detail = json.detail || detail;
                    } catch (_) {
                        // Response not JSON, use status code
                    }
                    showError(detail);
                    return;
                }

                const data = await res.json();
                addMessage(data.response, 'agent');
            } catch (err) {
                removeLoading();
                showError('Network error. Is the server running?');
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        inputEl.focus();
    </script>
</body>
</html>
